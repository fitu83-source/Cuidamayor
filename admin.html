<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>FamHealth — Panel Admin</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.x/dist/tabler-icons.min.css"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --verde:#2D6A4F;--vc:#52B788;--vs:#D8F3DC;
  --crema:#FAF7F2;--arena:#E9E0D0;--texto:#1A1A1A;--gris:#5C5C5C;
  --blanco:#FFFFFF;--rojo:#E07A5F;--rs:#FCEBEB;
  --as:#FAEEDA;--amber:#854F0B;--sb:210px;--sb-mini:52px;
  --bg2:#F5F4F0;--bdr:#E2DDD6;
}
@media(prefers-color-scheme:dark){:root{
  --crema:#1A1A1A;--texto:#F0EDE8;--gris:#9A9590;--blanco:#252525;
  --arena:#3A3A3A;--bg2:#222;--bdr:#3A3A3A;
  --vs:#1A3D2B;--as:#2D1F08;--rs:#2D1515;
}}
html,body{height:100%;font-family:'DM Sans',sans-serif;font-size:14px;color:var(--texto);background:var(--crema)}

/* LOGIN */
#ls{position:fixed;inset:0;background:var(--verde);display:flex;align-items:center;justify-content:center;z-index:1000}
.lb{background:var(--blanco);border-radius:16px;padding:2rem;width:300px;max-width:90vw}
.ll{font-size:22px;font-weight:500;color:var(--verde);margin-bottom:4px}
.ll span{color:var(--vc)}
.ls{font-size:12px;color:var(--gris);margin-bottom:2rem}
.lb label{font-size:12px;font-weight:500;display:block;margin-bottom:6px;color:var(--gris)}
.lb input{width:100%;padding:9px 12px;border:0.5px solid var(--bdr);border-radius:8px;font-size:16px;font-family:'DM Sans',sans-serif;color:var(--texto);background:var(--bg2);outline:none;margin-bottom:1rem;transition:border-color .2s}
.lb input:focus{border-color:var(--vc)}
.lbtn{width:100%;background:var(--verde);color:#fff;border:none;border-radius:8px;padding:12px;font-size:15px;font-weight:500;cursor:pointer;font-family:'DM Sans',sans-serif;transition:background .2s}
.lbtn:hover{background:#1f5239}
.le{color:var(--rojo);font-size:12px;margin-top:8px;display:none}

/* LAYOUT & SIDEBAR */
#app{display:none;height:100vh;overflow:hidden}
.sidebar{position:fixed;left:0;top:0;bottom:0;width:var(--sb);background:var(--blanco);border-right:0.5px solid var(--bdr);display:flex;flex-direction:column;z-index:200;transition:width .2s ease;overflow-y:auto}
.sidebar.mini{width:var(--sb-mini)}
.sidebar.mini .slogo-text,.sidebar.mini .nsec,.sidebar.mini .nb-text,.sidebar.mini .chip,.sidebar.mini .sfoot{display:none}
.sidebar.mini .nb{justify-content:center;padding:10px 0}
.sidebar.mini .nb i{font-size:18px}
@media(max-width:768px){
  .sidebar{width:80vw;max-width:280px;transform:translateX(-100%);transition:transform .25s ease;box-shadow:4px 0 20px rgba(0,0,0,.2);z-index:300}
  .sidebar.open{transform:translateX(0)}
  .main{margin-left:0!important}
  .topbar{display:flex!important}
}
#overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:250;backdrop-filter:blur(1px)}
#overlay.show{display:block}

/* TOPBAR */
.topbar{display:none;position:sticky;top:0;z-index:100;background:var(--blanco);border-bottom:0.5px solid var(--bdr);padding:10px 1rem;align-items:center;gap:10px;min-height:48px}
.topbar-logo{font-size:15px;font-weight:500;color:var(--verde);flex:1}
.topbar-logo span{color:var(--vc)}
.topbar-title{font-size:15px;font-weight:500;color:var(--texto);flex:1;display:none}
.menu-btn,.back-btn{background:none;border:none;cursor:pointer;color:var(--gris);padding:4px;font-size:20px;display:flex;align-items:center;gap:4px}

.toggle-btn{position:absolute;top:14px;right:-14px;width:28px;height:28px;border-radius:50%;background:var(--blanco);border:0.5px solid var(--bdr);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--gris);z-index:10}
.toggle-btn:hover{background:var(--bg2);color:var(--verde)}

.slogo{padding:14px 16px;font-size:15px;font-weight:500;color:var(--texto);border-bottom:0.5px solid var(--bdr);position:relative;display:flex;align-items:center;gap:8px}
.slogo span{color:var(--verde)}
.slogo small{display:block;font-size:10px;color:var(--gris);font-weight:400;margin-top:1px}
.nsec{font-size:10px;font-weight:500;color:var(--gris);padding:10px 16px 3px;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap}
.nb{display:flex;align-items:center;gap:8px;width:100%;padding:7px 16px;background:none;border:none;cursor:pointer;font-size:13px;font-family:'DM Sans',sans-serif;color:var(--gris);text-align:left;transition:all .15s;white-space:nowrap}
.nb:hover{background:var(--bg2);color:var(--texto)}
.nb.on{background:var(--vs);color:var(--verde);font-weight:500}
.nb i{font-size:15px;flex-shrink:0}
.chip{margin-left:auto;background:var(--rojo);color:#fff;border-radius:20px;font-size:10px;padding:1px 6px;display:none}
.sfoot{margin-top:auto;padding:12px 16px;border-top:0.5px solid var(--bdr);font-size:11px;color:var(--gris);line-height:1.7}
.sfoot a{color:var(--verde);text-decoration:none}

.main{margin-left:var(--sb);height:100vh;overflow-y:auto;padding:1.25rem;transition:margin-left .2s ease}
.main.mini{margin-left:var(--sb-mini)}
.pg{display:none}
.pg.on{display:block}
.ph h1{font-size:18px;font-weight:500;margin-bottom:2px}
.ph p{font-size:12px;color:var(--gris);margin-bottom:1rem}

/* CARDS & METRICS */
.mets{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:1rem}
@media(max-width:640px){.mets{grid-template-columns:repeat(2,1fr)}}
.met{background:var(--bg2);border-radius:8px;padding:12px}
.met .ml{font-size:11px;color:var(--gris);margin-bottom:3px}
.met .mv{font-size:22px;font-weight:500}
.met .md{font-size:11px;color:var(--vc);margin-top:2px}
.met.warn .mv{color:var(--amber)}

.card{background:var(--blanco);border:0.5px solid var(--bdr);border-radius:12px;padding:1rem;margin-bottom:.75rem}
.ch{display:flex;align-items:center;justify-content:space-between;margin-bottom:.75rem;gap:8px;flex-wrap:wrap}
.ct{font-size:13px;font-weight:500}
.two{display:grid;grid-template-columns:1fr 1fr;gap:.75rem}
@media(max-width:768px){.two{grid-template-columns:1fr}}

/* TABLES */
.tbl-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:12px;table-layout:fixed;min-width:480px}
th{text-align:left;padding:6px 8px;font-size:10px;font-weight:500;color:var(--gris);border-bottom:0.5px solid var(--bdr);text-transform:uppercase;cursor:pointer;user-select:none}
th:hover{background:var(--bg2)}
td{padding:8px;border-bottom:0.5px solid var(--bg2);color:var(--texto);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:middle}
tr:hover td{background:var(--bg2)}

/* COMPONENTS */
.badge{display:inline-block;font-size:10px;font-weight:500;padding:2px 7px;border-radius:20px}
.bg{background:var(--vs);color:var(--verde)}
.ba{background:var(--as);color:var(--amber)}
.br{background:var(--rs);color:#A32D2D}
.bb{background:#E6F1FB;color:#185FA5}
.bgr{background:var(--bg2);color:var(--gris)}
.bpu{background:#EDE9FE;color:#5B21B6}

.btn{font-size:11px;padding:3px 9px;border-radius:6px;cursor:pointer;border:0.5px solid var(--bdr);background:var(--blanco);color:var(--texto);font-family:'DM Sans',sans-serif;transition:all .15s;margin-right:4px}
.btn:hover{background:var(--bg2)}
.btn-p{background:var(--verde);color:#fff;border-color:var(--verde)}
.btn-p:hover{background:#1f5239}
.btn-d{color:#A32D2D;border-color:#F7C1C1}
.btn-sm{font-size:11px;padding:3px 8px}

.filt{display:flex;gap:6px;margin-bottom:.75rem;flex-wrap:wrap}
.filt input,.filt select{font-size:12px;padding:5px 8px;border:0.5px solid var(--bdr);border-radius:8px;background:var(--bg2);color:var(--texto);font-family:'DM Sans',sans-serif;outline:none}
.filt input{flex:1;min-width:120px}
.filt input:focus,.filt select:focus{border-color:var(--vc)}

.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:1rem}
@media(max-width:500px){.form-grid{grid-template-columns:1fr}}
.fg{display:flex;flex-direction:column;gap:4px}
.fg label{font-size:11px;font-weight:500;color:var(--gris)}
.fg input,.fg select,.fg textarea{font-size:14px;padding:9px 10px;border:0.5px solid var(--bdr);border-radius:8px;background:var(--bg2);color:var(--texto);font-family:'DM Sans',sans-serif;outline:none}
.fg textarea{resize:vertical;min-height:70px}
.fg.full{grid-column:1/-1}

.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:500;display:none;align-items:flex-end;justify-content:center}
@media(min-width:640px){.modal-bg{align-items:center}}
.modal-bg.open{display:flex}
.modal{background:var(--blanco);border-radius:14px 14px 0 0;padding:1.5rem;width:100%;max-width:560px;max-height:92vh;overflow-y:auto}
@media(min-width:640px){.modal{border-radius:14px}}
.modal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem}
.modal-title{font-size:15px;font-weight:500}
.modal-close{background:none;border:none;font-size:18px;cursor:pointer;color:var(--gris);padding:4px}

.tabs{display:flex;gap:4px;border-bottom:0.5px solid var(--bdr);margin-bottom:1rem;overflow-x:auto}
.tab{padding:7px 14px;font-size:12px;cursor:pointer;border:none;background:none;color:var(--gris);font-family:'DM Sans',sans-serif;border-bottom:2px solid transparent;transition:all .15s;white-space:nowrap}
.tab.on{color:var(--verde);border-bottom-color:var(--verde);font-weight:500}
.tab-pane{display:none}
.tab-pane.on{display:block}

.av{width:26px;height:26px;border-radius:50%;background:var(--vs);color:var(--verde);display:inline-flex;align-items:center;justify-content:center;font-size:10px;font-weight:500;margin-right:6px;vertical-align:middle;flex-shrink:0}
.spin{
